<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdaptiRAG | Ask your documents</title>
  <meta name="description"
    content="Upload documents and ask questions. AdaptiRAG chooses between vector search, a knowledge graph, or both, and shows the evidence behind every answer." />
  <meta property="og:title" content="AdaptiRAG | Ask your documents" />
  <meta property="og:description" content="Adaptive hybrid graph-vector RAG with query routing and cited evidence." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f6f7f9" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314181f'/%3E%3Cpath d='M6 8 C14 8 14 16 22 16' stroke='%2314b8a6' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6 16 H22' stroke='%236366f1' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M6 24 C14 24 14 16 22 16' stroke='%23f59e0b' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='16' r='3' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"
    rel="stylesheet" />
  <script>
    // Apply the saved theme before the first paint so there is no flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('adaptirag-theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
